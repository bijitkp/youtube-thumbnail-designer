[project]
name = "youtube-thumbnail-designer"
version = "0.1.0"
description = "Agentic Loop YouTube Designer using LangGraph & Groq"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "groq",
    "tavily-python",
    "python-dotenv",
    "requests",
    "openai>=1.0.0",
    "tavily-python>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "nodes", "tools"]
